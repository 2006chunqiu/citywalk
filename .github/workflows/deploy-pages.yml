name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 注意：GitHub 不允许工作流自动创建 Pages 站点
      # （会报 Resource not accessible by integration）。
      # 所以仓库必须先手动启用一次：Settings → Pages → Source 选 GitHub Actions。
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 仓库页面部署在 /citywalk/ 子路径
          VITE_BASE: /citywalk/
          # 现在后端还没上线，先走 mock 数据，页面能完整体验
          VITE_MOCK: 'true'
          VITE_AMAP_JS_KEY: ${{ secrets.VITE_AMAP_JS_KEY }}
          VITE_AMAP_JS_SECRET: ${{ secrets.VITE_AMAP_JS_SECRET }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
